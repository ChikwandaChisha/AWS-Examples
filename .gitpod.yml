# .gitpod.yml
# This file configures your Gitpod workspace environment

tasks:
  - name: aws-cli
    env: AWS_CLI_AUTO_PROMPT=on-partial
    
    before:
      cd /Github
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      unzip awscliv2.zip
      sudo ./aws/install
      cd $PWD

vscode:
  extensions:
    - amazonwebservices.aws-toolkit-vscode

