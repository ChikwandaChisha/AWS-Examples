tasks:
  install-aws-cli:
    name: Install AWS CLI
    description: Install the checked-in AWS CLI bundle for this environment.
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild
    command: |
      set -e
      if command -v aws >/dev/null 2>&1; then
        aws --version
        exit 0
      fi

      install_dir="$(mktemp -d)"
      trap 'rm -rf "$install_dir"' EXIT
      unzip -q awscliv2.zip -d "$install_dir"
      sudo "$install_dir/aws/install"
      aws --version
